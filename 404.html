<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>
    <link rel="icon" type="image/x-icon" href="Images/logo.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            overflow: hidden;
            color: white;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        .error-code {
            font-size: 150px;
            font-weight: bold;
            line-height: 1;
            color: #60a5fa;
            text-shadow: 0 0 20px rgba(96, 165, 250, 0.6);
        }

        .title {
            font-size: 40px;
            margin-top: 10px;
            font-weight: 700;
        }

        .description {
            margin-top: 15px;
            font-size: 18px;
            color: #d1d5db;
            max-width: 600px;
            line-height: 1.6;
        }

        .home-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 35px;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s ease;
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
        }

        .home-btn:hover {
            background: #2563eb;
            transform: translateY(-3px);
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            animation: float 6s infinite ease-in-out;
        }

        .circle:nth-child(1) {
            width: 200px;
            height: 200px;
            top: 10%;
            left: 10%;
        }

        .circle:nth-child(2) {
            width: 300px;
            height: 300px;
            bottom: -100px;
            right: -50px;
            animation-delay: 2s;
        }

        .circle:nth-child(3) {
            width: 150px;
            height: 150px;
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 100px;
            }

            .title {
                font-size: 28px;
            }

            .description {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>

    <div class="container">
        <h1 class="error-code">404</h1>
        <h2 class="title">Page Not Found</h2>
        <p class="description">
            Sorry, the page you are looking for does not exist or has been moved.
        </p>

        <a href="index.html" class="home-btn">
            Back to Home
        </a>
    </div>

</body>
</html>
